paths_config: configs/paths.local.yml
task_type: classification
seed: 42
device: auto
model:
  name: sonoglore_convnext_tiny
  pretrained: true
  in_chans: 3
  num_classes: 2
  drop_path_rate: 0.10
  proj_dim: 256
  stage_proj_dims: [192, 256, 320]
  stage_fusion_weights: [0.8, 1.0, 1.0]
  attn_heads: 4
  attn_mlp_ratio: 2.0
  head_hidden_dim: 256
  attn_dropout: 0.1
  head_dropout: 0.2
  active_stage_indices: [2, 3, 4]
  use_stage4_attention: false
  use_projection_grn: true
  use_projection_eca: true
  use_scale_gate: false
data:
  image_size: 224
  batch_size: 8
  num_workers: 0
  preprocess:
    clahe: true
    use_timm_data_config: true
  augmentation:
    horizontal_flip: true
    flip_probability: 0.5
    rotation_degrees: 6
    brightness: 0.04
    contrast: 0.08
    scale_min: 0.95
    scale_max: 1.05
training:
  epochs: 30
  learning_rate: 0.00003
  weight_decay: 0.08
  label_smoothing: 0.03
  class_weights: balanced
  checkpoint_strategy: best_auc
  scheduler:
    name: warmup_cosine
    warmup_epochs: 4
    min_lr: 0.000001
  fold_count: 5
  split_path: ./artifacts/reports/busbra_5fold_splits.csv
  positive_class: malignant
output:
  checkpoint_name: sonoglore_convnext_tiny_grn_eca_asymproj_regularized_fold{fold}.pt
  report_name: train_cls_sonoglore_convnext_tiny_grn_eca_asymproj_regularized_fold{fold}.json
