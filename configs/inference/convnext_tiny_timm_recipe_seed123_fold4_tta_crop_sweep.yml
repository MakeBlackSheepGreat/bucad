paths_config: configs/paths.local.yml
seed: 42
device: auto
runtime:
  classifier_model: convnext_tiny
  classifier_pretrained: false
  classifier_device: auto
  classifier_image_size: 224
  classifier_apply_clahe: true
  classifier_mean:
  - 0.485
  - 0.456
  - 0.406
  classifier_std:
  - 0.229
  - 0.224
  - 0.225
  classifier_interpolation: bicubic
  classifier_crop_pct: 0.95
  classifier_tta_horizontal_flip: false
  classifier_tta_variants:
  - name: identity
    crop_pct: 0.9
  - name: hflip
    crop_pct: 0.9
  - name: identity
    crop_pct: 0.95
  - name: hflip
    crop_pct: 0.95
  - name: identity
    crop_pct: 1.0
  - name: hflip
    crop_pct: 1.0
  primary_classifier_model: ConvNeXt-Tiny
  ensemble_display_name: ConvNeXt-Tiny Fold1 crop-sweep 对照模型
  default_threshold: 0.5
  borderline_margin: 0.08
  classifier_checkpoint: ./artifacts/checkpoints/convnext_tiny_timm_recipe_seed123_fold4.pt
  classifier_members: []
  segmenter_checkpoint: null
  segmenter_image_size: 256
  gradcam_enabled: false
  segmentation_enabled: false
  allow_missing_visuals: true
