paths_config: configs/paths.local.yml
task_type: classification
seed: 42
device: auto
model:
  name: convnext_tiny
  pretrained: true
  in_chans: 3
  num_classes: 2
data:
  image_size: 224
  batch_size: 8
  num_workers: 0
  preprocess:
    clahe: true
    use_timm_data_config: true
  augmentation:
    horizontal_flip: true
    flip_probability: 0.5
    rotation_degrees: 5.0
    brightness: 0.08
    contrast: 0.08
    scale_min: 0.92
    scale_max: 1.08
training:
  epochs: 24
  learning_rate: 0.00004
  weight_decay: 0.06
  label_smoothing: 0.03
  loss: focal
  focal_gamma: 1.5
  class_weights: balanced
  sample_weight_path: ./artifacts/reports/busbra_oof_hard_sample_weights.csv
  sample_weight_column: sample_weight
  checkpoint_strategy: best_auc
  scheduler:
    name: warmup_cosine
    warmup_epochs: 3
    min_lr: 0.000001
  fold_count: 5
  split_path: ./artifacts/reports/busbra_5fold_splits.csv
  positive_class: malignant
output:
  checkpoint_name: convnext_tiny_hard_oof_focal_fold{fold}.pt
  report_name: train_cls_convnext_tiny_hard_oof_focal_fold{fold}.json
