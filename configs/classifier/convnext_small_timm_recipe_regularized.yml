paths_config: configs/paths.local.yml
task_type: classification
seed: 42
device: auto
model:
  name: convnext_small
  pretrained: true
  in_chans: 3
  num_classes: 2
  drop_path_rate: 0.20
data:
  image_size: 224
  batch_size: 6
  num_workers: 0
  preprocess:
    clahe: true
    use_timm_data_config: true
  augmentation:
    horizontal_flip: true
    flip_probability: 0.5
    rotation_degrees: 8
    brightness: 0.06
    contrast: 0.10
    scale_min: 0.92
    scale_max: 1.08
training:
  epochs: 30
  learning_rate: 0.00002
  weight_decay: 0.08
  label_smoothing: 0.05
  class_weights: balanced
  checkpoint_strategy: best_auc
  scheduler:
    name: warmup_cosine
    warmup_epochs: 4
    min_lr: 0.000001
  fold_count: 5
  split_path: ./artifacts/reports/busbra_5fold_splits.csv
  positive_class: malignant
output:
  checkpoint_name: convnext_small_timm_recipe_regularized_fold{fold}.pt
  report_name: train_cls_convnext_small_timm_recipe_regularized_fold{fold}.json
