paths_config: configs/paths.local.yml
seed: 42
device: auto
runtime:
  classifier_model: lesionext_lens_tiny
  classifier_pretrained: false
  classifier_model_kwargs:
    backbone_name: convnext_tiny
    evidence_alpha_init: 0.02
    evidence_gate_mode: disabled
    local_evidence_auxiliary: true
    head_dropout: 0.2
  classifier_image_size: 224
  classifier_apply_clahe: true
  classifier_mean: null
  classifier_std: null
  classifier_interpolation: area
  classifier_crop_pct: 1.0
  classifier_tta_horizontal_flip: false
  default_threshold: 0.5
  borderline_margin: 0.08
  classifier_checkpoint: ./artifacts/checkpoints/lesionext_lens_v3_label_aware_fold1.pt
  classifier_checkpoints: []
  classifier_members: []
  segmenter_checkpoint: null
  segmenter_image_size: 256
  gradcam_enabled: false
  segmentation_enabled: false
  allow_missing_visuals: true
