paths_config: configs/paths.local.yml
seed: 42
device: auto
runtime:
  classifier_model: resnet18
  classifier_pretrained: false
  classifier_image_size: 224
  classifier_apply_clahe: false
  classifier_tta_horizontal_flip: false
  default_threshold: 0.5
  borderline_margin: 0.08
  classifier_checkpoint: null
  classifier_checkpoints: []
  classifier_members:
    - model: resnet18
      checkpoint: ./artifacts/checkpoints/classifier_fold1.pt
      weight: 1.0
      image_size: 224
      apply_clahe: false
      tta_variants:
        - name: identity
    - model: resnet18
      checkpoint: ./artifacts/checkpoints/classifier_fold2.pt
      weight: 1.0
      image_size: 224
      apply_clahe: false
      tta_variants:
        - name: identity
    - model: resnet18
      checkpoint: ./artifacts/checkpoints/classifier_fold3.pt
      weight: 1.0
      image_size: 224
      apply_clahe: false
      tta_variants:
        - name: identity
    - model: resnet18
      checkpoint: ./artifacts/checkpoints/classifier_fold4.pt
      weight: 1.0
      image_size: 224
      apply_clahe: false
      tta_variants:
        - name: identity
    - model: resnet18
      checkpoint: ./artifacts/checkpoints/classifier_fold5.pt
      weight: 1.0
      image_size: 224
      apply_clahe: false
      tta_variants:
        - name: identity
  segmenter_checkpoint: null
  segmenter_image_size: 256
  gradcam_enabled: false
  segmentation_enabled: false
  allow_missing_visuals: true
