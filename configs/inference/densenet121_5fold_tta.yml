paths_config: configs/paths.local.yml
seed: 42
device: auto
runtime:
  classifier_model: densenet121
  classifier_pretrained: false
  classifier_image_size: 224
  classifier_apply_clahe: true
  classifier_tta_horizontal_flip: true
  default_threshold: 0.5
  borderline_margin: 0.08
  classifier_checkpoint: null
  classifier_checkpoints:
    - ./artifacts/checkpoints/densenet121_fold1.pt
    - ./artifacts/checkpoints/densenet121_fold2.pt
    - ./artifacts/checkpoints/densenet121_fold3.pt
    - ./artifacts/checkpoints/densenet121_fold4.pt
    - ./artifacts/checkpoints/densenet121_fold5.pt
  classifier_members:
    - model: densenet121
      checkpoint: ./artifacts/checkpoints/densenet121_fold1.pt
      weight: 1.0
    - model: densenet121
      checkpoint: ./artifacts/checkpoints/densenet121_fold2.pt
      weight: 1.0
    - model: densenet121
      checkpoint: ./artifacts/checkpoints/densenet121_fold3.pt
      weight: 1.0
    - model: densenet121
      checkpoint: ./artifacts/checkpoints/densenet121_fold4.pt
      weight: 1.0
    - model: densenet121
      checkpoint: ./artifacts/checkpoints/densenet121_fold5.pt
      weight: 1.0
  segmenter_checkpoint: null
  segmenter_image_size: 256
  gradcam_enabled: false
  segmentation_enabled: false
  allow_missing_visuals: true
