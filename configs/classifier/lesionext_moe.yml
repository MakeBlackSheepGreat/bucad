paths_config: configs/paths.local.yml
task_type: classification
seed: 42
device: auto
experiment:
  family: LesioNeXt-MoE
  version: v1
  objective: LesioNeXt-MoE learned soft lesion-scale expert routing over full-image and ROI descriptors
  baseline_config: configs/classifier/lesionext.yml
model:
  name: lesionext_moe
  pretrained: true
  in_chans: 3
  num_classes: 2
  descriptor_dim: 14
  expert_hidden_dim: 256
  router_hidden_dim: 160
  router_temperature: 1.0
  fixed_equal_expert_weights: false
  stage_proj_dims: [192, 256, 320]
  stage_fusion_weights: [0.8, 1.0, 1.0]
  attn_heads: 4
  attn_mlp_ratio: 2.0
  head_hidden_dim: 256
  attn_dropout: 0.1
  head_dropout: 0.2
  active_stage_indices: [2, 3, 4]
  use_stage4_attention: false
  use_projection_grn: true
  use_projection_eca: true
  use_scale_gate: false
data:
  input_mode: dual_view_roi
  image_size: 224
  batch_size: 8
  num_workers: 4
  prefetch_factor: 2
  roi:
    mask_threshold: 0.4
    margin_ratio: 0.35
    min_area_ratio: 0.08
    max_area_ratio: 0.75
    largest_component: true
  preprocess:
    clahe: true
    use_timm_data_config: true
  augmentation:
    horizontal_flip: true
    flip_probability: 0.5
training:
  epochs: 30
  learning_rate: 0.00003
  weight_decay: 0.05
  class_weights: balanced
  positive_class_weight: 1.7
  checkpoint_strategy: best_auc
  scheduler:
    name: warmup_cosine
    warmup_epochs: 3
    min_lr: 0.000001
  fold_count: 5
  split_path: ./artifacts/reports/busbra_5fold_splits.csv
  positive_class: malignant
output:
  checkpoint_name: lesionext_moe_fold{fold}.pt
  report_name: train_cls_lesionext_moe_fold{fold}.json
