paths_config: configs/paths.local.yml
seed: 42
device: auto
runtime:
  model_family: lesionext
  primary_classifier_model: LesioNeXt-BUS
  ensemble_display_name: LesioNeXt-BUS Unified Diagnosis
  lesionext_checkpoint: ./artifacts/checkpoints/lesionext_fold1.pt
  lesionext_device: auto
  lesionext_image_size: 256
  lesionext_model:
    architecture: lesionext
    in_channels: 3
    classes: 1
    num_classes: 2
    widths: [32, 64, 128, 192]
    embedding_dim: 128
    dropout: 0.2
  default_threshold: 0.51
  borderline_margin: 0.08
  segmentation_enabled: true
  gradcam_enabled: false
  allow_missing_visuals: true
