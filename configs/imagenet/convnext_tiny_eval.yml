paths_config: configs/paths.local.yml
seed: 42
device: auto
experiment:
  family: ConvNeXt
  version: tiny
  benchmark: ImageNet-1K fair evaluation
dataset:
  root: null
  split: val
  num_classes: 1000
model:
  name: convnext_tiny
  pretrained: true
  in_chans: 3
  num_classes: 1000
  checkpoint: null
data:
  image_size: 224
  batch_size: 64
  num_workers: 4
  preprocess:
    use_timm_data_config: true
    mean: null
    std: null
    interpolation: null
    crop_pct: null
evaluation:
  # 官方 timm 权重含完整 ImageNet 分类头，可作为公开预训练基线。
  allow_official_pretrained_baseline: true
  amp: true
  channels_last: false
output:
  report_name: imagenet_convnext_tiny_eval.json
