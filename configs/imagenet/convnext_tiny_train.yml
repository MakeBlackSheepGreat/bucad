paths_config: configs/paths.local.yml
seed: 42
device: auto
experiment:
  family: ConvNeXt
  version: tiny
  benchmark: ImageNet-1K fair training
  protocol_reference: ConvNeXt CVPR 2022 Appendix A.1
dataset:
  root: null
  num_classes: 1000
model:
  name: convnext_tiny
  pretrained: false
  in_chans: 3
  num_classes: 1000
data:
  image_size: 224
  batch_size: 64
  num_workers: 4
  drop_last: true
  preprocess:
    use_timm_data_config: false
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    interpolation: bicubic
    crop_pct: 0.875
  train_augmentation:
    scale: [0.08, 1.0]
    ratio: [0.75, 1.3333333333]
    hflip: 0.5
    vflip: 0.0
    color_jitter: 0.4
    auto_augment: rand-m9-mstd0.5-inc1
    random_erasing_prob: 0.25
    random_erasing_mode: pixel
    random_erasing_count: 1
training:
  optimizer: adamw
  base_learning_rate: 0.004
  reference_batch_size: 4096
  scale_lr_by_batch_size: true
  weight_decay: 0.05
  betas: [0.9, 0.999]
  epochs: 300
  warmup_epochs: 20
  min_lr: 0.0
  label_smoothing: 0.1
  mixup_alpha: 0.8
  cutmix_alpha: 1.0
  mix_probability: 1.0
  mix_switch_probability: 0.5
  amp: true
  channels_last: false
  use_ema: false
evaluation:
  amp: true
  channels_last: false
output:
  checkpoint_name: imagenet_convnext_tiny.pt
  report_name: imagenet_convnext_tiny_train.json
