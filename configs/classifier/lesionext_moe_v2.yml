paths_config: configs/paths.local.yml
task_type: classification
seed: 42
device: auto
experiment:
  family: LesioNeXt-MoE
  version: v2
  objective: LesioNeXt-MoE v2 with area-prior routing, spatial small-lesion expert, residual logits, and segmenter-OOF ROI training
  baseline_config: configs/classifier/lesionext_moe.yml
model:
  name: lesionext_moe_v2_tiny
  pretrained: true
  in_chans: 3
  num_classes: 2
  descriptor_dim: 14
  expert_hidden_dim: 256
  router_hidden_dim: 160
  router_temperature: 1.0
  fixed_equal_expert_weights: false
  area_prior_strength: 0.75
  area_prior_small_center: 0.12
  area_prior_medium_center: 0.32
  area_prior_large_center: 0.68
  area_prior_sigma: 0.22
  small_spatial_hidden_dim: 96
  residual_alpha: 0.15
  stage_proj_dims: [192, 256, 320]
  stage_fusion_weights: [0.8, 1.0, 1.0]
  attn_heads: 4
  attn_mlp_ratio: 2.0
  head_hidden_dim: 256
  attn_dropout: 0.1
  head_dropout: 0.2
  active_stage_indices: [2, 3, 4]
  use_stage4_attention: false
  use_projection_grn: true
  use_projection_eca: true
  use_scale_gate: false
data:
  input_mode: dual_view_roi
  image_size: 224
  batch_size: 8
  num_workers: 4
  prefetch_factor: 2
  roi:
    mask_source: segmenter_oof
    mask_cache_dir: artifacts/cache/segmenter_oof_masks_v2
    segmenter_checkpoint_pattern: artifacts/checkpoints/segmenter_5fold_fold{fold}.pt
    segmenter_image_size: 256
    mask_threshold: 0.4
    margin_ratio: 0.35
    min_area_ratio: 0.08
    max_area_ratio: 0.75
    largest_component: true
  preprocess:
    clahe: true
    use_timm_data_config: true
  augmentation:
    horizontal_flip: true
    flip_probability: 0.5
training:
  epochs: 30
  learning_rate: 0.00003
  weight_decay: 0.05
  class_weights: balanced
  positive_class_weight: 1.7
  moe_load_balance_weight: 0.02
  checkpoint_strategy: best_auc
  scheduler:
    name: warmup_cosine
    warmup_epochs: 3
    min_lr: 0.000001
  fold_count: 5
  split_path: ./artifacts/reports/busbra_5fold_splits.csv
  positive_class: malignant
output:
  checkpoint_name: lesionext_moe_v2_tiny_fold{fold}.pt
  report_name: train_cls_lesionext_moe_v2_fold{fold}.json
