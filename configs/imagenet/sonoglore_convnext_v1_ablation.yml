paths_config: configs/paths.local.yml
seed: 42
device: auto
experiment:
  family: SonoGloRe-ConvNeXt
  version: v1
  benchmark: ImageNet-1K ablation
dataset:
  root: null
  split: val
  num_classes: 1000
data:
  image_size: 224
  batch_size: 64
  num_workers: 4
  preprocess:
    use_timm_data_config: true
evaluation:
  amp: true
  channels_last: false
models:
  - id: convnext_tiny
    name: ConvNeXt-Tiny
    model:
      name: convnext_tiny
      pretrained: false
      in_chans: 3
      num_classes: 1000
      checkpoint: ./artifacts/checkpoints/imagenet_convnext_tiny.pt
  - id: v1_full
    name: SonoGloRe-ConvNeXt V1
    model:
      name: sonoglore_convnext_v1
      pretrained: false
      in_chans: 3
      num_classes: 1000
      checkpoint: ./artifacts/checkpoints/imagenet_sonoglore_convnext_v1.pt
  - id: v1_no_eca
    name: V1 without ECA
    model:
      name: sonoglore_convnext_v1
      pretrained: false
      in_chans: 3
      num_classes: 1000
      use_projection_eca: false
      checkpoint: ./artifacts/checkpoints/imagenet_sonoglore_convnext_v1_no_eca.pt
  - id: v1_no_grn
    name: V1 without projection GRN
    model:
      name: sonoglore_convnext_v1
      pretrained: false
      in_chans: 3
      num_classes: 1000
      use_projection_grn: false
      checkpoint: ./artifacts/checkpoints/imagenet_sonoglore_convnext_v1_no_grn.pt
  - id: v1_uniform_projection
    name: V1 uniform projection dims
    model:
      name: sonoglore_convnext_v1
      pretrained: false
      in_chans: 3
      num_classes: 1000
      stage_proj_dims: [256, 256, 256]
      stage_fusion_weights: [1.0, 1.0, 1.0]
      checkpoint: ./artifacts/checkpoints/imagenet_sonoglore_convnext_v1_uniform_projection.pt
output:
  report_name: imagenet_sonoglore_convnext_v1_ablation.json
  markdown_name: imagenet_sonoglore_convnext_v1_ablation.md
