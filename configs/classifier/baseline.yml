paths_config: configs/paths.local.yml
task_type: classification
seed: 42
device: auto
model:
  name: resnet18
  pretrained: true
  in_chans: 3
  num_classes: 2
data:
  image_size: 224
  batch_size: 8
  num_workers: 0
training:
  epochs: 5
  learning_rate: 0.0003
  weight_decay: 0.0001
  fold_count: 5
  split_path: ./artifacts/reports/busbra_5fold_splits.csv
  positive_class: malignant
output:
  checkpoint_name: classifier_fold{fold}.pt
  report_name: train_cls_fold{fold}.json
