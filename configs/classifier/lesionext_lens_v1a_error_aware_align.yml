paths_config: configs/paths.local.yml
task_type: classification
seed: 42
device: auto
experiment:
  family: LesioNeXt-LENS
  version: v1a-error-aware-align
  objective: training-only hard-example weighting for BBOX evidence alignment
  baseline_config: configs/classifier/lesionext_lens_v1a_evidence_only.yml
  selection_scope: BUSBRA fold1 only; external datasets remain frozen
model:
  name: lesionext_lens_tiny
  pretrained: true
  in_chans: 3
  num_classes: 2
  backbone_name: convnext_tiny
  evidence_alpha_init: 0.02
  evidence_gate_mode: disabled
  head_dropout: 0.2
data:
  input_mode: lesion_evidence
  image_size: 224
  batch_size: 8
  num_workers: 0
  preprocess:
    clahe: true
    use_timm_data_config: true
  augmentation:
    horizontal_flip: true
    flip_probability: 0.5
training:
  epochs: 30
  learning_rate: 0.00005
  weight_decay: 0.05
  class_weights: balanced
  checkpoint_strategy: best_auc
  lesion_evidence:
    alignment_weight: 0.25
    bbox_margin: 0.08
    error_aware_weighting:
      enabled: true
      scale: 0.50
      formula: 0.75 + scale * (1 - p_true)
      batch_normalize_valid_samples: true
      stop_if_weight_saturates: true
  scheduler:
    name: warmup_cosine
    warmup_epochs: 3
    min_lr: 0.000001
  fold_count: 5
  split_path: ./artifacts/reports/busbra_5fold_splits.csv
  positive_class: malignant
output:
  checkpoint_name: lesionext_lens_v1a_error_aware_align_fold{fold}.pt
  report_name: train_cls_lesionext_lens_v1a_error_aware_align_fold{fold}.json
