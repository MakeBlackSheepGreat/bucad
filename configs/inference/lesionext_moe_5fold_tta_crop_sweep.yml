paths_config: configs/paths.local.yml
seed: 42
device: auto
runtime:
  classifier_model: lesionext_moe
  classifier_pretrained: false
  classifier_device: auto
  classifier_input_mode: dual_view_roi
  classifier_model_kwargs:
    descriptor_dim: 14
    expert_hidden_dim: 256
    router_hidden_dim: 160
    router_temperature: 1.0
    fixed_equal_expert_weights: false
    stage_proj_dims: [192, 256, 320]
    stage_fusion_weights: [0.8, 1.0, 1.0]
    attn_heads: 4
    attn_mlp_ratio: 2.0
    head_hidden_dim: 256
    attn_dropout: 0.1
    head_dropout: 0.2
    active_stage_indices: [2, 3, 4]
    use_stage4_attention: false
    use_projection_grn: true
    use_projection_eca: true
    use_scale_gate: false
  classifier_image_size: 224
  classifier_apply_clahe: true
  classifier_mean: [0.485, 0.456, 0.406]
  classifier_std: [0.229, 0.224, 0.225]
  classifier_interpolation: bicubic
  classifier_crop_pct: 0.95
  classifier_tta_horizontal_flip: false
  classifier_tta_variants:
    - name: identity
      crop_pct: 0.90
    - name: hflip
      crop_pct: 0.90
    - name: identity
      crop_pct: 0.95
    - name: hflip
      crop_pct: 0.95
    - name: identity
      crop_pct: 1.00
    - name: hflip
      crop_pct: 1.00
  classifier_roi:
    mask_threshold: 0.4
    margin_ratio: 0.35
    min_area_ratio: 0.08
    max_area_ratio: 0.75
    largest_component: true
  primary_classifier_model: LesioNeXt-MoE
  ensemble_display_name: LesioNeXt-MoE 5-fold crop-sweep TTA
  default_threshold: 0.5
  borderline_margin: 0.08
  classifier_checkpoint: null
  classifier_checkpoints:
    - ./artifacts/checkpoints/lesionext_moe_fold1.pt
    - ./artifacts/checkpoints/lesionext_moe_fold2.pt
    - ./artifacts/checkpoints/lesionext_moe_fold3.pt
    - ./artifacts/checkpoints/lesionext_moe_fold4.pt
    - ./artifacts/checkpoints/lesionext_moe_fold5.pt
  classifier_members:
    - model: lesionext_moe
      checkpoint: ./artifacts/checkpoints/lesionext_moe_fold1.pt
      weight: 1.0
    - model: lesionext_moe
      checkpoint: ./artifacts/checkpoints/lesionext_moe_fold2.pt
      weight: 1.0
    - model: lesionext_moe
      checkpoint: ./artifacts/checkpoints/lesionext_moe_fold3.pt
      weight: 1.0
    - model: lesionext_moe
      checkpoint: ./artifacts/checkpoints/lesionext_moe_fold4.pt
      weight: 1.0
    - model: lesionext_moe
      checkpoint: ./artifacts/checkpoints/lesionext_moe_fold5.pt
      weight: 1.0
  segmenter_checkpoint: ./artifacts/checkpoints/segmenter_fold1.pt
  segmenter_image_size: 256
  segmentation_enabled: true
  gradcam_enabled: false
  allow_missing_visuals: true
