paths_config: configs/paths.local.yml
seed: 42
device: auto
runtime:
  classifier_model: swin_tiny_patch4_window7_224
  classifier_pretrained: false
  classifier_image_size: 224
  classifier_apply_clahe: true
  classifier_mean: [0.485, 0.456, 0.406]
  classifier_std: [0.229, 0.224, 0.225]
  classifier_interpolation: bicubic
  classifier_crop_pct: 0.9
  classifier_tta_horizontal_flip: false
  classifier_tta_variants:
    - name: identity
      crop_pct: 0.90
    - name: hflip
      crop_pct: 0.90
    - name: identity
      crop_pct: 0.95
    - name: hflip
      crop_pct: 0.95
    - name: identity
      crop_pct: 1.00
    - name: hflip
      crop_pct: 1.00
  default_threshold: 0.5
  borderline_margin: 0.08
  classifier_checkpoint: null
  classifier_checkpoints:
    - ./artifacts/checkpoints/swin_tiny_patch4_window7_224_timm_recipe_fold1.pt
    - ./artifacts/checkpoints/swin_tiny_patch4_window7_224_timm_recipe_fold2.pt
    - ./artifacts/checkpoints/swin_tiny_patch4_window7_224_timm_recipe_fold3.pt
    - ./artifacts/checkpoints/swin_tiny_patch4_window7_224_timm_recipe_fold4.pt
    - ./artifacts/checkpoints/swin_tiny_patch4_window7_224_timm_recipe_fold5.pt
  classifier_members:
    - model: swin_tiny_patch4_window7_224
      checkpoint: ./artifacts/checkpoints/swin_tiny_patch4_window7_224_timm_recipe_fold1.pt
      weight: 1.0
    - model: swin_tiny_patch4_window7_224
      checkpoint: ./artifacts/checkpoints/swin_tiny_patch4_window7_224_timm_recipe_fold2.pt
      weight: 1.0
    - model: swin_tiny_patch4_window7_224
      checkpoint: ./artifacts/checkpoints/swin_tiny_patch4_window7_224_timm_recipe_fold3.pt
      weight: 1.0
    - model: swin_tiny_patch4_window7_224
      checkpoint: ./artifacts/checkpoints/swin_tiny_patch4_window7_224_timm_recipe_fold4.pt
      weight: 1.0
    - model: swin_tiny_patch4_window7_224
      checkpoint: ./artifacts/checkpoints/swin_tiny_patch4_window7_224_timm_recipe_fold5.pt
      weight: 1.0
  segmenter_checkpoint: null
  segmenter_image_size: 256
  gradcam_enabled: false
  segmentation_enabled: false
  allow_missing_visuals: true
