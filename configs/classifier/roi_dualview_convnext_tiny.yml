paths_config: configs/paths.local.yml
task_type: classification
seed: 42
device: auto
model:
  name: roi_dualview_convnext_tiny
  pretrained: true
  in_chans: 3
  num_classes: 2
  descriptor_dim: 14
  fusion_hidden_dim: 512
  dropout: 0.2
data:
  input_mode: dual_view_roi
  image_size: 224
  batch_size: 8
  num_workers: 0
  roi:
    mask_threshold: 0.4
    margin_ratio: 0.35
    min_area_ratio: 0.08
    max_area_ratio: 0.75
    largest_component: true
  preprocess:
    clahe: true
    use_timm_data_config: true
  augmentation:
    horizontal_flip: true
    flip_probability: 0.5
training:
  epochs: 30
  learning_rate: 0.00005
  weight_decay: 0.05
  class_weights: balanced
  checkpoint_strategy: youden
  sensitivity_weight: 0.1
  scheduler:
    name: warmup_cosine
    warmup_epochs: 3
    min_lr: 0.000001
  fold_count: 5
  split_path: ./artifacts/reports/busbra_5fold_splits.csv
  positive_class: malignant
output:
  checkpoint_name: roi_dualview_convnext_tiny_fold{fold}.pt
  report_name: train_cls_roi_dualview_convnext_tiny_fold{fold}.json
