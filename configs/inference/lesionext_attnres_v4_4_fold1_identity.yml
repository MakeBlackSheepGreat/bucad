paths_config: configs/paths.local.yml
seed: 42
device: auto
runtime:
  classifier_model: lesionext_attnres_tiny
  classifier_pretrained: false
  classifier_device: auto
  classifier_input_mode: single_image
  classifier_model_kwargs:
    backbone_name: convnext_tiny
    attnres_stages: [3, 4]
    attnres_block_size: 2
    attnres_temperature: 1.0
    attnres_gate_init: 0.0
    head_dropout: 0.2
  classifier_image_size: 224
  classifier_apply_clahe: true
  classifier_mean: [0.485, 0.456, 0.406]
  classifier_std: [0.229, 0.224, 0.225]
  classifier_interpolation: bicubic
  classifier_crop_pct: 0.95
  classifier_tta_horizontal_flip: false
  classifier_tta_variants:
    - name: identity
      crop_pct: 0.95
  primary_classifier_model: LesioNeXt-AttnRes V4.4
  ensemble_display_name: LesioNeXt-AttnRes V4.4 Fold1 identity
  default_threshold: 0.5
  borderline_margin: 0.08
  classifier_checkpoint: ./artifacts/checkpoints/lesionext_attnres_v4_4_fold1.pt
  classifier_checkpoints: []
  classifier_members: []
  segmenter_checkpoint: null
  segmentation_enabled: false
  gradcam_enabled: false
  allow_missing_visuals: true
